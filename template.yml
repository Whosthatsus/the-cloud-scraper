AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  The Cloud Scraper — Serverless Automated Data Pipeline
  Cloud Architecture Design (CAD) Course Project.
  Orchestrates scheduled/on-demand website scraping, data validation,
  deduplication via SHA-256 fingerprinting, Amazon S3 raw archival,
  and Amazon DynamoDB structured storage via AWS Step Functions.

Parameters:
  pProjectName:
    Type: String
    Description: Project prefix name for naming resources
    Default: the-cloud-scraper

  pS3BucketName:
    Type: String
    Description: Unique S3 bucket name for raw HTML snapshots and transformed JSON datasets
    AllowedPattern: "[a-z0-9][a-z0-9.-]*[a-z0-9]"
    Default: the-cloud-scraper-datalake-cad-2026

  pEmailforNotification:
    Type: String
    Description: Valid email address for SNS pipeline execution alerts and failure notifications
    Default: alert-recipient@example.com

  pScrapeSchedule:
    Type: String
    Description: EventBridge cron expression for automated scraping executions
    Default: "cron(0 12 * * ? *)"

  pDefaultSiteId:
    Type: String
    Description: Default target website identifier
    Default: books_toscrape
    AllowedValues:
      - books_toscrape
      - quotes_toscrape

Resources:

  # ============================================================================
  # 1. CLOUD STORAGE: Amazon S3 Data Lake (Raw HTML + Transformed JSON)
  # ============================================================================
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref pS3BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  # ============================================================================
  # 2. CLOUD STORAGE: Amazon DynamoDB NoSQL Structured Store
  # ============================================================================
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-records"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: site_id
          AttributeType: S
        - AttributeName: record_id
          AttributeType: S
        - AttributeName: content_hash
          AttributeType: S
      KeySchema:
        - AttributeName: site_id
          KeyType: HASH
        - AttributeName: record_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: content_hash-index
          KeySchema:
            - AttributeName: content_hash
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: !Ref pProjectName
        - Key: Course
          Value: CloudArchitectureDesign

  # ============================================================================
  # 3. WORK DISTRIBUTION & FAULT TOLERANCE: Amazon SQS & Dead-Letter Queue
  # ============================================================================
  ScraperDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-scraper-dlq"
      MessageRetentionPeriod: 1209600 # 14 days
      KmsMasterKeyId: alias/aws/sqs

  ScraperJobQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-scraper-job-queue"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 86400 # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ScraperDLQ.Arn
        maxReceiveCount: 3
      KmsMasterKeyId: alias/aws/sqs

  # ============================================================================
  # 4. NOTIFICATIONS: Amazon SNS Alert Topic
  # ============================================================================
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-notifications"
      KmsMasterKeyId: alias/aws/sns
      Subscription:
        - Endpoint: !Ref pEmailforNotification
          Protocol: email

  # ============================================================================
  # 5. IAM ROLES (Least-Privilege Security Principles)
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-lambda-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3DataLakeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${pS3BucketName}"
                  - !Sub "arn:aws:s3:::${pS3BucketName}/*"

        - PolicyName: DynamoDBStructuredStoreAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub "${DynamoDBTable.Arn}/index/*"

        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt ScraperJobQueue.Arn
                  - !GetAtt ScraperDLQ.Arn

        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopic

        - PolicyName: StepFunctionsStartAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-pipeline-sm"

  StepFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-sfn-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokePipelineLambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ScraperFunction.Arn
                  - !GetAtt ValidationFunction.Arn
                  - !GetAtt TransformationFunction.Arn
                  - !GetAtt StorageFunction.Arn
                  - !GetAtt NotificationFunction.Arn
        - PolicyName: SQSDeadLetterAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt ScraperDLQ.Arn
        - PolicyName: SNSPublishAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopic
        - PolicyName: XRayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"

  # ============================================================================
  # 6. SERVERLESS COMPUTE: AWS Lambda Pipeline Functions
  # ============================================================================
  ScraperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-scraper"
      Handler: scraper.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          RAW_S3_BUCKET: !Ref pS3BucketName
          SITES_CONFIG_PATH: config/sites_config.json

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-validation"
      Handler: validation.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SITES_CONFIG_PATH: config/sites_config.json

  TransformationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-transformation"
      Handler: transformation.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn

  StorageFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-storage"
      Handler: dynamodb_store.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTable
          S3_BUCKET_NAME: !Ref pS3BucketName

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-notification"
      Handler: notification.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopic

  JobDispatcherFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-dispatcher"
      Handler: start_step_function.lambda_handler
      CodeUri: lambda
      Runtime: python3.10
      MemorySize: 256
      Timeout: 60
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          STEP_FUNC_ARN: !Ref CloudScraperStateMachine
          S3_BUCKET_NAME: !Ref pS3BucketName
          DYNAMODB_TABLE_NAME: !Ref DynamoDBTable
          SITES_CONFIG_PATH: config/sites_config.json
          SQS_QUEUE_URL: !Ref ScraperJobQueue
      Events:
        OnDemandApiTrigger:
          Type: Api
          Properties:
            Path: /scrape
            Method: post
            RestApiId: !Ref ApiGatewayRestApi
        QueueJobTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt ScraperJobQueue.Arn
            BatchSize: 1

  # ============================================================================
  # 7. AUTOMATION & TRIGGERS: EventBridge Rule & API Gateway
  # ============================================================================
  ApiGatewayRestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      TracingEnabled: true

  ScraperScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-scheduled-rule"
      Description: Scheduled trigger to execute website scraping jobs
      ScheduleExpression: !Ref pScrapeSchedule
      State: ENABLED
      Targets:
        - Arn: !GetAtt JobDispatcherFunction.Arn
          Id: ScraperJobDispatcherTarget
          Input: !Sub '{"site_id": "${pDefaultSiteId}", "source": "aws.events"}'

  EventBridgeInvokeDispatcherPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt JobDispatcherFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScraperScheduleRule.Arn

  # ============================================================================
  # 8. WORKFLOW ORCHESTRATION: AWS Step Functions State Machine
  # ============================================================================
  CloudScraperStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub "${AWS::StackName}-pipeline-sm"
      RoleArn: !GetAtt StepFunctionExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "The Cloud Scraper - Serverless Automated Data Pipeline State Machine",
          "StartAt": "Scrape Target Website",
          "States": {
            "Scrape Target Website": {
              "Type": "Task",
              "Resource": "${ScraperFunction.Arn}",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed", "Lambda.ServiceException", "Lambda.AWSLambdaException"],
                  "IntervalSeconds": 3,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error_info",
                  "Next": "Route Failure to DLQ"
                }
              ],
              "Next": "Scrape Succeeded?"
            },
            "Scrape Succeeded?": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.status",
                  "StringEquals": "SUCCESS",
                  "Next": "Validate Extracted Records"
                }
              ],
              "Default": "Route Failure to DLQ"
            },
            "Validate Extracted Records": {
              "Type": "Task",
              "Resource": "${ValidationFunction.Arn}",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error_info",
                  "Next": "Route Failure to DLQ"
                }
              ],
              "Next": "Validation Succeeded?"
            },
            "Validation Succeeded?": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.Validation",
                  "StringEquals": "SUCCESS",
                  "Next": "Transform and Deduplicate"
                }
              ],
              "Default": "Route Failure to DLQ"
            },
            "Transform and Deduplicate": {
              "Type": "Task",
              "Resource": "${TransformationFunction.Arn}",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error_info",
                  "Next": "Route Failure to DLQ"
                }
              ],
              "Next": "Store in DynamoDB and S3"
            },
            "Store in DynamoDB and S3": {
              "Type": "Task",
              "Resource": "${StorageFunction.Arn}",
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "ResultPath": "$.error_info",
                  "Next": "Route Failure to DLQ"
                }
              ],
              "Next": "Publish Success Notification"
            },
            "Route Failure to DLQ": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sqs:sendMessage",
              "Parameters": {
                "QueueUrl": "${ScraperDLQ}",
                "MessageBody.$": "$"
              },
              "Next": "Publish Failure Notification"
            },
            "Publish Success Notification": {
              "Type": "Task",
              "Resource": "${NotificationFunction.Arn}",
              "End": true
            },
            "Publish Failure Notification": {
              "Type": "Task",
              "Resource": "${NotificationFunction.Arn}",
              "Next": "Fail Execution"
            },
            "Fail Execution": {
              "Type": "Fail",
              "Cause": "The Cloud Scraper pipeline encountered unrecoverable errors.",
              "Error": "PipelineExecutionError"
            }
          }
        }

  # ============================================================================
  # 9. OBSERVABILITY: CloudWatch Alarms
  # ============================================================================
  ScraperDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-dlq-messages-alarm"
      AlarmDescription: Triggers when messages arrive in the Scraper Dead-Letter Queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ScraperDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SNSTopic

Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions Pipeline State Machine
    Value: !Ref CloudScraperStateMachine
    Export:
      Name: !Sub "${AWS::StackName}-StateMachineArn"

  DynamoDBTableName:
    Description: Name of the structured DynamoDB records table
    Value: !Ref DynamoDBTable
    Export:
      Name: !Sub "${AWS::StackName}-DynamoDBTable"

  S3DataLakeBucket:
    Description: S3 Data Lake Bucket for raw HTML and transformed JSON
    Value: !Ref S3Bucket
    Export:
      Name: !Sub "${AWS::StackName}-S3Bucket"

  ApiEndpoint:
    Description: On-Demand API Gateway POST endpoint URL
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/scrape"

  ScraperJobQueueUrl:
    Description: SQS Job Queue URL for distributing scraping runs
    Value: !Ref ScraperJobQueue

  ScraperDLQUrl:
    Description: SQS Dead-Letter Queue URL for failed scraping messages
    Value: !Ref ScraperDLQ